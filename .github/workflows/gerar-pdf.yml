name: Gerar relatório PDF
on:
  push:
    branches: [main]
    paths:
      - 'src/gerar_pdf.py'
      - '.github/workflows/gerar-pdf.yml'
      - 'resultados/**'
      - 'graficos/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar gerador
        run: python -m pip install reportlab pillow
      - name: Gerar PDF
        run: python src/gerar_pdf.py
      - name: Versionar relatório final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add relatorio/relatorio_final.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: gerar relatorio academico PDF"
            git push
          fi
