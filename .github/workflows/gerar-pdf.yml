name: Experimentos e relatório final (30 repetições)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gerar-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experiments-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install matplotlib reportlab pillow
      - name: Verificar algoritmos
        run: python src/testes.py
      - name: Executar experimentos medidos
        run: python -u src/experimentos.py --repeticoes 30
      - name: Gerar graficos e LaTeX
        run: python src/gerar_relatorio.py
      - name: Gerar PDF identificado
        run: python src/gerar_pdf.py
      - name: Publicar dados, graficos e PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultados graficos relatorio/relatorio_final.pdf
          if ! git diff --cached --quiet; then
            git commit -m "results: medições atualizadas, graficos e PDF"
            git push
          fi
